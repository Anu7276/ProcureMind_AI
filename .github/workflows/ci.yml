name: CI — BIS Recommendation Engine

on:
  push:
    branches: [main, dev, 'feat/**']
  pull_request:
    branches: [main]

env:
  LLM_PROVIDER: mock
  PYTHONPATH: .

jobs:
  # ─────────────────────────────────────────────────────────────────
  # 1. Lint & type-check
  # ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install lint tools
        run: pip install ruff==0.6.9

      - name: Run ruff
        run: ruff check ai/ backend/ tests/ --select E,F,W --ignore E501

  # ─────────────────────────────────────────────────────────────────
  # 2. Unit tests (mock mode, no DB/GPU)
  # ─────────────────────────────────────────────────────────────────
  test:
    name: Tests (mock mode)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies (CI-minimal)
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest tests/ -q --tb=short --timeout=120
        env:
          LLM_PROVIDER: mock

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: .pytest_cache/

  # ─────────────────────────────────────────────────────────────────
  # 3. Evaluation gate — Family Recall@5 must be >= 95%
  # ─────────────────────────────────────────────────────────────────
  eval-gate:
    name: Eval gate (Family Recall@5 ≥ 95%)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run evaluation
        run: |
          python ai/evaluation/eval_runner.py \
            --out ai/evaluation/ci_eval.json \
            --provider mock
        env:
          LLM_PROVIDER: mock

      - name: Check Family Recall@5 gate
        run: |
          python - <<'EOF'
          import json, sys
          with open("ai/evaluation/ci_eval.json") as f:
              data = json.load(f)
          family_r5 = data.get("family_recall_at_5", 0.0)
          print(f"Family Recall@5: {family_r5*100:.1f}%")
          if family_r5 < 0.95:
              print(f"FAIL: Family Recall@5 {family_r5*100:.1f}% < 95% gate")
              sys.exit(1)
          print("PASS: Eval gate satisfied")
          EOF

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.sha }}
          path: ai/evaluation/ci_eval.json
